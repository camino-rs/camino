on:
  push:
    branches:
      - main
  workflow_dispatch:

name: Docs

permissions:
  contents: read

# Allow an in-flight deploy to finish rather than cancelling it, since a
# cancelled deployment can leave the Pages site in a partial state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTDOCFLAGS: -Dwarnings --cfg=doc_cfg
        run: cargo doc --all-features --workspace
      - name: Organize
        run: |
          rm -rf target/gh-pages
          mkdir target/gh-pages
          mv target/doc target/gh-pages/rustdoc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/gh-pages

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
